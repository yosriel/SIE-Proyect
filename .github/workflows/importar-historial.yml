name: Publicar los archivos verificados de Omni-SI Falabella
on:
  push:
    branches: [main]
    paths: ['.github/workflows/importar-historial.yml']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Incorporar el historial y los archivos a main
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode transferencia/SIE-Proyect.bundle.b64 > "$RUNNER_TEMP/SIE.bundle"
          echo "d834401cc2a0c0222930e72e23cf367f6eff8eeafa1529e8d01dcd387f6d6c41  $RUNNER_TEMP/SIE.bundle" | sha256sum --check
          git bundle verify "$RUNNER_TEMP/SIE.bundle"
          git fetch "$RUNNER_TEMP/SIE.bundle" refs/heads/main
          entrega=$(git rev-parse FETCH_HEAD)
          test "$entrega" = 6170f14fd1ee1b182e1912a735b8ba44feab1d79
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          final=$(git commit-tree "$entrega^{tree}" -p "$GITHUB_SHA" -p "$entrega" -m 'Publica el código, las evidencias y los entregables de SIE Proyect')
          git push origin "$final:refs/heads/main"
